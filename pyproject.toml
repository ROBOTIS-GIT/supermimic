[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "Humanoid whole-body motion tracking with one differentiable world model."
readme = "README.md"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt", "PATCHES.md"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.11",
    "tensordict>=0.14.2",
    "rsl-rl-lib>=5.4.2,<6",
]

[project.optional-dependencies]
mjlab = [
    "mjlab @ git+https://github.com/HybridRobotics/mjlab_research.git@dd51a9fcc98791a2f0b018b3c7f71a3eefd5ecdd",
    "tyro>=1.0.1",
    "wandb>=0.22.3",
    "viser>=1.0.24",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
research = {requires-python = ">=3.13,<3.14"}

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]

[dependency-groups]
research = ["supermimic[mjlab]"]
dev = [
    "ruff>=0.14.10",
    "ipdb>=0.13.13",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
]
